# Render Blueprint for SchoolVote
# Docs: https://render.com/docs/blueprint-spec
#
# Data persistence:
#   Votes live in a hosted SQLite database on Turso (free) instead of the
#   ephemeral local disk, so redeploys/restarts never lose data.
#   - TURSO_URL points at your Turso database (e.g. libsql://school-vote-xxx.turso.io)
#     and TURSO_AUTH_TOKEN is its auth token. Set the token in the Render
#     dashboard (Environment); it is marked sync:false so it never goes in git.
#   - When TURSO_URL is absent (local development) the app falls back to a
#     local file DB at ./data/school-vote.db.

services:
  - type: web
    name: school-vote
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/election
    envVars:
      - key: NODE_ENV
        value: production
      - key: PAYMENT_MODE
        value: paystack
      - key: PUBLIC_BASE_URL
        value: https://school-vote.onrender.com
      - key: PAYSTACK_CURRENCY
        value: KES
      - key: PAYSTACK_CHANNELS
        value: card,mobile_money,bank_transfer
      # Point this at your Turso database (replace with your own URL).
      - key: TURSO_URL
        value: libsql://school-vote.turso.io
      # Secret — set in the Render dashboard (Environment), never in a file.
      - key: TURSO_AUTH_TOKEN
        sync: false
      # Set the secret in the Render dashboard (Environment), never in a file.
      - key: PAYSTACK_SECRET_KEY
        sync: false